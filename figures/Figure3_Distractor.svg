580c" stroke-width="1.2" opacity="1"/><text x="106" y="264.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="264.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="251" width="44" height="19" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2" opacity="1"/><text x="188" y="264.5" font-size="12" fill="#1f2937" text-anchor="middle">3</text><text x="218" y="264.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="286" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 5</text><rect x="84" y="274" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="287.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="287.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="274" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="287.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="287.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="309" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 6</text><rect x="84" y="297" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="310.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="310.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="297" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="310.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="310.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><rect x="14" y="344" width="234" height="66" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="14" y="354" width="5" height="46" rx="2.5" fill="#ea580c" opacity="1"/><text x="36" y="373" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Run</text><rect x="30" y="372" width="202" height="30" rx="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.4" opacity="1"/><text x="131.0" y="392.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">▶  Run this line</text><rect x="286" y="66" width="870" height="170" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="286" y="76" width="5" height="150" rx="2.5" fill="#0d9488" opacity="1"/><text x="308" y="95" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700">Quality &amp; Yield Lab — when quality is capacity</text><rect x="308" y="110" width="65.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="340.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Quality</text><rect x="380.0" y="110" width="37.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="398.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Fed</text><rect x="424.0" y="110" width="86.0" height="22" rx="11" fill="#0d9488" opacity="1"/><text x="467.0" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">Yield loss</text><rect x="517.0" y="110" width="79.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="556.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Wrong fix</text><rect x="603.0" y="110" width="79.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="642.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Right fix</text><rect x="689.0" y="110" width="79.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="728.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Challenge</text><text x="308" y="162" font-size="13" fill="#0d9488" text-anchor="start" font-weight="700" letter-spacing="0.5">Yield loss appears</text><text x="308" y="186" font-size="21" fill="#1f2937" text-anchor="start" font-weight="700">Fast — but scrapping most of it</text><text x="308" y="210" font-size="14" fill="#5b6472" text-anchor="start">Station 3 keeps its full speed (2 dice) but now scraps 60% of every batch. Predict what that</text><text x="308" y="230" font-size="14" fill="#5b6472" text-anchor="start">does to the whole line's throughput.</text><text x="308" y="260" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="700">Predict:  Despite its speed, Station 3 scrapping 60% will make the line's throughput…</text><circle cx="317" cy="281" r="8.5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><circle cx="317" cy="281" r="4.2" fill="#ea580c"/><text x="336" y="286" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="600">Barely change — it's fast</text><circle cx="317" cy="311" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="316" font-size="14.5" fill="#5b6472" text-anchor="start">Rise</text><circle cx="317" cy="341" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="346" font-size="14.5" fill="#5b6472" text-anchor="start">Collapse — it becomes the real constraint</text><circle cx="317" cy="371" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="376" font-size="14.5" fill="#5b6472" text-anchor="start">Double</text><text x="308" y="404" font-size="14" fill="#b54708" text-anchor="start" font-weight="700">You picked “Barely change — it's fast.”</text><rect x="308" y="416" width="826" height="46" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2" opacity="1"/><rect x="308" y="416" width="4" height="46" rx="0" fill="#ea580c" opacity="1"/><text x="324" y="435" font-size="13.5" fill="#7c2d12" text-anchor="start" font-weight="600">Speed only helps if the units survive — you're counting attempts, not good bottles.</text><text x="324" y="454" font-size="13" fill="#7c2d12" text-anchor="start">A station's effective capacity is its speed × its yield.</text><text x="308" y="488" font-size="13.5" fill="#b54708" text-anchor="start" font-weight="700">Here's what actually happened:</text><rect x="308" y="498" width="826" height="58" rx="8" fill="#fffaf0" stroke="#fde3c0" stroke-width="1.2" opacity="1"/><rect x="308" y="498" width="5" height="58" rx="2.5" fill="#b54708" opacity="1"/><text x="326" y="523" font-size="13.5" fill="#7c2d12" text-anchor="start" font-weight="600">Good output collapsed to 3,049 bottles at 41% yield. The fast station is now the real</text><text x="326" y="544" font-size="13" fill="#7c2d12" text-anchor="start">constraint — 4,403 bottles were scrapped before they could be sold.</text></svg>