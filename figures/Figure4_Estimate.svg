6" rx="2.5" fill="#ea580c" opacity="1"/><text x="36" y="373" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Run</text><rect x="30" y="372" width="202" height="30" rx="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.4" opacity="1"/><text x="131.0" y="392.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">▶  Run this line</text><rect x="286" y="66" width="870" height="164" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="286" y="76" width="5" height="144" rx="2.5" fill="#ea580c" opacity="1"/><text x="308" y="95" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700">Operations Lab — the Five Focusing Steps</text><text x="308" y="120" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700" letter-spacing="0.5">Set the stage</text><text x="308" y="144" font-size="21" fill="#1f2937" text-anchor="start" font-weight="700">The balanced line</text><text x="308" y="170" font-size="14" fill="#5b6472" text-anchor="start">Six stations, each averaging 3.5 bottles/hr. Estimate what this balanced line will</text><text x="308" y="190" font-size="14" fill="#5b6472" text-anchor="start">actually finish in a year — then run it and see.</text><rect x="308" y="199" width="826" height="26" rx="6" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="316" y="216" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="700">The setup:</text><text x="388" y="216" font-size="12.5" fill="#5b6472" text-anchor="start">1 die × 6 faces at every station · unlimited supply · no WIP cap · 1 year</text><text x="308" y="258" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="700">Estimate:  How many bottles will this balanced line actually finish in a year?</text><rect x="308" y="270" width="200" height="34" rx="7" fill="#ffffff" stroke="#ea580c" stroke-width="1.6" opacity="1"/><text x="322" y="292" font-size="16" fill="#1f2937" text-anchor="start" font-weight="60