[pytest]
# Run the suite across worker processes (pytest-xdist).
#
# This is not a speed tweak. Running all ~720 tests in one interpreter is not safe on this stack: the headless page
# tests start ~300 full Streamlit app sessions in a single process, and after roughly 60-250 of them the process
# corrupts its own memory. It then either fails with an impossible array shape (for example
# "value array of shape (3,) could not be broadcast to indexing result of shape (3,0,0)") or dies outright with
# "Windows fatal exception: access violation". The crash site moves between runs - heiner_abm/arena.py in three
# observed crashes, heiner_abm/calibration.py in a fourth - which is why it is not a bug in any one of them.
#
# Measured on 2026-10-09, Python 3.9.10 / numpy 2.0.2 / scipy-openblas 0.3.27 / streamlit 1.50.0:
#   one process, all 301 page tests        failed or crashed in 4 of 7 runs
#   seven processes, 43 page tests each    7 of 7 clean (301/301 passed)
#   -n 8, whole suite                      2 of 2 clean (711 passed, and ~6 minutes faster)
# Capping OpenBLAS threads to 1 did NOT help (a capped run still failed), so it is not BLAS threading.
#
# Keeping each worker's share well under the threshold is what makes the suite reliable. Use fewer workers only if
# a reason to; expect the flakiness back if you force everything into one process (-n 0). The count is fixed
# rather than "auto" because auto is the core count (32 on the machine above), and that many Streamlit workers
# starve the background-run subprocess in tests/test_workbench.py until it exceeds its wait budget.
addopts = -n 8
testpaths = tests
